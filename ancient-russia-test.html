<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Древняя Русь. Тест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: узкая колонка 520px как в образце: белая липкая шапка с плашкой номеров, тёплый серый фон, фиолетовый акцент */
:root{--ink:#1a1a1a;--muted:#666;--soft:#888;--bg:#f4f3ee;--card:#fff;--line:#e5e4de;--edge:#ddd;--accent:#7C3AED;--accent-d:#6D28D9;--accent-bg:#F5F3FF;--accent-ink:#4C1D95;
  --ok:#3B6D11;--ok-bg:#EAF3DE;--bad:#A32D2D;--bad-bg:#FCEBEB;--bad-edge:#E24B4A;
  --font-b:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;min-height:100vh;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0 24px}
.header{background:var(--card);border-bottom:1px solid var(--line);padding:.8rem max(16px,env(safe-area-inset-left,0px)) .7rem;text-align:center;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.header h1{font-size:17px;font-weight:600;margin:0 0 8px}
.plaque{display:grid;gap:5px;grid-template-columns:repeat(10,1fr);max-width:520px;margin:0 auto}
.chip{font:600 13px var(--font-b);height:28px;border-radius:8px;border:1.5px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer;padding:0;transition:background .2s}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.fail{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.retry{background:var(--bad-bg);border:1.5px dashed var(--bad-edge);color:var(--bad)}
.chip.cur{box-shadow:0 0 0 2px var(--accent)}
.chip.off{opacity:.35;cursor:not-allowed}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{font-size:12px;color:var(--soft);margin-top:7px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.screen{max-width:520px;margin:0 auto;padding:1.2rem max(16px,env(safe-area-inset-left,0px)) 1rem}
main{scroll-margin-top:120px}
.thead{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-bottom:2px}
h2{font-size:18px;font-weight:600;margin:0}
.tries{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;background:#e0dfd8}
.dot.used{background:var(--accent)}
.src{font-size:13px;color:var(--soft);margin:0 0 .4rem}
.intro{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 1rem}
.quote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:0 0 1rem;font-size:14px;line-height:1.6}
.quote b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.map{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;margin:0 0 4px;cursor:zoom-in}
.maphint{font-size:12px;color:#aaa;text-align:center;margin:0 0 1rem}
.part{margin:0 0 1rem}
.plabel{font-weight:600;font-size:14px;margin:0 0 .5rem}
.lists{display:grid;gap:8px;margin-bottom:.8rem}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem;margin:0 0 .8rem;list-style:none}
.lists .list{margin:0}
.list h4{margin:2px 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600}
.list li{display:flex;gap:8px;padding:3px 0;font-size:14px}
.mark{flex:none;min-width:22px;font-weight:600;color:var(--accent)}
.tablebox{overflow-x:auto;margin-bottom:.8rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{background:#faf9f5;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:600}
.ph{color:var(--accent)}
.ans{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ans label{font-weight:600;font-size:14px}
.hint{font-size:12px;color:var(--soft);flex-basis:100%;margin:0}
input[type=text]{flex:1 1 180px;font:15px var(--font-b);color:var(--ink);background:#fff;border:1.5px solid var(--edge);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s;min-width:0}
input[type=text]:focus{border-color:var(--accent)}
input:disabled{background:#faf9f5;color:var(--ink)}
.actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.actions .fb{order:-1}
button.big{display:block;width:100%;padding:13px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:15px var(--font-b);cursor:pointer;transition:background .15s}
button.big:active,button.big:hover{background:var(--accent-d)}
button.ghost{font:12px var(--font-b);background:none;border:0;color:#aaa;cursor:pointer;padding:6px 12px}
.fb{text-align:center;font-size:14px;font-weight:500;min-height:20px}
.fb.warn,.fb.bad{color:var(--bad)}
.fb.good{color:var(--ok)}
.key{font-size:13px;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:8px 12px;margin-top:.8rem;line-height:1.5}
.big-msg{text-align:center;padding:1rem 0}
.big-msg h2{font-size:22px;margin-bottom:6px}
.big-msg p{color:var(--muted);font-size:14px;margin:0 0 .8rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:1.2rem 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 6px}
.tile b{display:block;font-size:22px;font-weight:600;color:var(--accent)}
.tile span{font-size:11px;color:#999}
.lb{position:fixed;inset:0;background:rgba(20,18,40,.85);z-index:20;overflow:auto;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:min(100%,1100px);background:#fff;border-radius:8px}
footer{text-align:center;margin-top:1rem}
</style>

/*14*/{src:SRC2,intro:'Прочтите отрывок из документа и выполните задание.',quote:['Из документа','«Когда ______ был в Новгороде, пришла к нему весть, что печенеги осадили Киев. ______ собрал воинов многих, варягов и словен, пришёл к Киеву и вошёл в город свой… Печенеги пошли на приступ и схватились на месте, где стоит ныне святая София, митрополия русская: было здесь тогда поле вне града. И была сеча жестокая, и едва к вечеру одолел ______. И побежали печенеги врассыпную, и не знали, куда бежать, одни, убегая, тонули в Сетомли, иные же в других реках, а остаток их бегает где-то и до сего дня… Заложил ______ город великий, у того же града Золотые ворота; заложил и церковь святой Софии, митрополию… И стала при нём вера христианская плодиться и расширяться, и черноризцы стали умножаться, и монастыри появляться. И любил ______ церковные уставы, попов любил немало, особенно же черноризцев, и книги любил, читая их часто и ночью, и днём. И собрал писцов многих, и переводили они с греческого на славянский язык. И написали они книг множество, ими же поучаются верующие люди и наслаждаются учением божественным. Как если один землю вспашет, другой же засеет, а иные жнут и едят пищу неоскудевающую, — так и этот. Отец ведь его ______ землю вспахал и размягчил, то есть крещением просветил. Этот же засеял книжными словами сердца верующих людей, а мы пожинаем, учение принимая книжное».'],
  parts:[multi(['Жена этого князя провела налоговую реформу.','Этот князь основал Троице-Сергиеву лавру.','Этот князь погиб от руки печенежского хана.','Современником этого князя был митрополит Иларион.','Отцом князя, имя которого пропущено в отрывке, был Владимир I.','Эти события происходили в XI веке.'],'456',INTRO_MULTI)]},
/*15*/{src:SRC2,intro:'Прочтите отрывок из летописи и выполните задание.',quote:['Из летописи','«Пошёл Олег на греков, оставив Игоря в Киеве; взял же с собою множество варягов, и славян, и чуди, и кривичей, и мерю, и древлян, и радимичей, и полян, и северян, и вятичей, и хорватов, и дулебов, и тиверцев, известных как толмачи: этих всех называли греки “Великая Скифь”. И с этими всеми пошёл Олег на конях и в кораблях; и было кораблей числом 2000. И пришёл к Царьграду: греки же замкнули Суд, а город затворили. И вышел Олег на берег, и начал воевать... И повелел Олег своим воинам сделать колёса и поставить на колёса корабли. И когда подул попутный ветер, подняли они в поле паруса и пошли к городу. Греки же, увидев это, испугались и сказали, послав к Олегу: “Не губи города, дадим тебе дань, какую захочешь”. И остановил Олег воинов, и вынесли ему пищу и вино, но не принял его, так как было оно отравлено. И испугались греки, и сказали: “Это не Олег, но святой Дмитрий, посланный на нас Богом”. И приказал Олег дать дани на 2000 кораблей: по 12 гривен на человека, а было в каждом корабле по 40 мужей. И согласились на это греки, и стали греки просить мира, чтобы не воевал Греческой земли. Олег же, немного отойдя от столицы, начал переговоры о мире с греческими царями Леоном и Александром...»'],
  parts:[multi(['Город, на который был совершён поход, был развитым торговым центром.','Эти события произошли после образования Древнерусского государства.','Результатом похода стала контрибуция от Руси Византии.','Во время этого похода в Киеве осталась править княгиня Ольга.','Автор пишет, что русское войско не могло долго воевать из-за недостатка кораблей.','Русское войско в походе состояло из разных племён.'],'126',INTRO_MULTI)]},
/*16*/{src:SRC2,intro:INTRO_MATCH,parts:[match(['Закуп','Рядович','Смерд','Холоп','Люди'],['Свободные общинники','Полузависимый человек, который заключил договор с феодалом и обязался на него работать','Человек, взявший у феодала ссуду и отрабатывающий её','Зависимый от феодала человек, раб','Полузависимый человек, который нёс повинности в пользу князя'],'32541',['Понятия','Определения'])]},
/*17*/{src:SRC2,intro:'Заполните пропуски в определениях терминов: впишите термин одним словом.',parts:[
  text('1. … — сочетание в верованиях и обрядах жителей Руси X–XIII веков языческих и христианских представлений.',['двоеверие'],'двоеверие','Термин'),
  text('2. … — княжеский наместник высокородного происхождения.',['посадник'],'посадник','Термин')]},
/*18*/{src:SRC2,intro:'Прочтите отрывок и выполните задания.',quote:['Отрывок','«Вернувшись в 969 году в Болгарию и захватив Преслав, от пленных болгар Святослав Игоревич узнал о предательстве их и объявил им о намерении идти на _____________. Новый правитель _____________, император Иоанн Цимисхий в свою очередь предлагал «наглому варвару» забрать положенную за нападение на Болгарию награду и возвратиться в свою страну».'],
  parts:[text('1. Назовите век, когда происходят события. Запишите ответ словом.',['десятый','десятый век'],'десятый','Век'),
  text('2. Укажите пропущенное название города (первый пропуск).',['константинополь','царьград','константинополь царьград'],'Константинополь (Царьград)','Город')]},
/*19*/{src:SRC2,intro:'Рассмотрите схему и выполните задание.',img:'m10',parts:[multi(['Византийское войско в сражении, обозначенном на схеме цифрой «3», возглавил Иоанн Цимисхий.','Сражение под цифрой «1» состоялось раньше битвы под цифрой «3».','Поход Святослава на вятичей произошёл по причине убийства этим племенем отца Святослава князя Игоря.','В результате сражения под цифрой «3» русский князь был вынужден заключить мир с Византией и покинуть Балканы.','Князь, чьи походы на схеме, умер от укуса змеи.','В знак победы над Византией, одержанной в этой войне, русский князь прибил щит над воротами Царьграда (Константинополя).'],'124',INTRO_MULTI)]},
/*20*/{src:SRC2,intro:'Рассмотрите схему и выполните задание.',img:'m11',parts:[multi(['На схеме подписана столица Болгарского царства.','Походы под тонкими стрелками были раньше походов под цифрой «6».','На схеме подписан город, в котором крестился Владимир I.','Князь, чьи походы обозначены цифрой «6», был автором «Повести временных лет».','Ни один из князей, чьи походы обозначены на схеме стрелками, не ходил на Волжскую Булгарию.','Цифрой «4» обозначено место расселения восточнославянских племён.'],'1236',INTRO_MULTI)]}
];
const N=TASKS.length, TINTS=['#ffe8d4','#ece4ff','#fff1bf','#dcefff','#ffe0ee'];
const KEYS='rus-test-v1';
const $=id=>document.getElementById(id);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);for(const k in(attrs||{})){const v=attrs[k];if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}kids.flat().forEach(c=>{if(c!=null)e.append(c.nodeType?c:document.createTextNode(c))});return e};
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const fresh=()=>({phase:'main',view:'task',tour:0,cur:0,inTour:[],finished:false,t:TASKS.map(()=>({st:'pending',att:0,first:null,vals:{},msg:''}))});
let S=fresh();
try{const r=JSON.parse(localStorage.getItem(KEYS)||'null');if(r&&r.t&&r.t.length===N)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEYS,JSON.stringify(S))}catch(e){}};
const cid=(i,p,k)=>`c_${i}_${p}_${k}`;

function readPart(i,p,part){const v=$(cid(i,p,0)).value;
  if(part.t==='text')return{empty:!norm(v),ok:part.accept.includes(norm(v))};
  const d=v.replace(/\D/g,'');
  const ok=part.t==='multi'?d.split('').sort().join('')===part.key.split('').sort().join(''):d===part.key;
  return{empty:!d,ok}}
function snapshot(i){const vals={};TASKS[i].parts.forEach((_,p)=>vals[cid(i,p,0)]=$(cid(i,p,0)).value);S.t[i].vals=vals}
function fillCorrect(i){const vals={};TASKS[i].parts.forEach((part,p)=>vals[cid(i,p,0)]=part.t==='text'?part.show:part.key);S.t[i].vals=vals}

function check(){const i=S.cur,t=S.t[i],task=TASKS[i];
  const res=task.parts.map((part,p)=>readPart(i,p,part));
  snapshot(i);
  if(res.some(r=>r.empty)){t.msg='Сначала заполни все поля.';t.msgKind='warn';render();return}
  t.att++;
  if(res.every(r=>r.ok)){t.st='ok';t.msg='Верно!';t.msgKind='good'}
  else if(t.att===1){t.msg='Не совсем, подумай ещё раз!';t.msgKind='warn'}
  else if(t.att===2){t.msg='Все же что-то не так :0';t.msgKind='warn'}
  else{t.st='fail';t.msgKind='bad';t.msg='Три попытки позади. Правильный ответ показан ниже.';fillCorrect(i)}
  if(t.st!=='pending'&&t.first===null)t.first=t.st;
  render()}

function pendingList(){const pool=S.phase==='tour'?S.inTour:[...Array(N).keys()];return pool.filter(i=>S.t[i].st==='pending')}
function nextTask(){const p=pendingList();if(p.length){const a=p.find(i=>i>S.cur);S.cur=a!==undefined?a:p[0];render(true)}else finishRound()}
function finishRound(){const pool=S.phase==='tour'?S.inTour:[...Array(N).keys()];const fails=pool.filter(i=>S.t[i].st==='fail');
  if(!fails.length){S.view='done';S.finished=true}
  else{S.phase='tour';S.tour++;S.inTour=fails;fails.forEach(i=>S.t[i]={...S.t[i],st:'pending',att:0,vals:{},msg:''});S.view='intro';S.cur=fails[0]}
  render(true)}
function go(i){if(S.phase==='tour'&&!S.inTour.includes(i))return;S.cur=i;S.view='task';render(true)}

function renderPlaque(){const p=$('plaque');p.replaceChildren();
  S.t.forEach((t,i)=>{const inTour=S.phase==='tour'&&S.inTour.includes(i);
    let c='chip',lab='не решено';
    if(inTour&&t.st==='pending'){c+=' retry';lab='ошибка, нужно повторить'}
    else if(t.st==='ok'){c+=' ok';lab='верно'}else if(t.st==='fail'){c+=' fail';lab='неверно'}
    if(S.phase==='tour'&&!inTour)c+=' off';
    if(S.view==='task'&&i===S.cur)c+=' cur';
    p.append(h('button',{class:c,type:'button','aria-label':`Задание ${i+1}, ${lab}`,onclick:()=>go(i)},String(i+1)))})}
function renderStats(){const ok=S.t.filter(t=>t.st==='ok').length,bad=S.t.filter(t=>t.st==='fail').length,left=N-ok-bad;
  const st=$('stats');st.replaceChildren(...[h('span',{},`Верно: ${ok}`),h('span',{},`Ошибки: ${bad}`),h('span',{},`Осталось: ${left}`),S.tour?h('span',{},`Тур ошибок №${S.tour}`):null].filter(Boolean))}

function numList(items,title){return h('ul',{class:'list'},title?h('h4',{},title):null,...items.map((x,j)=>h('li',{},h('span',{class:'mark'},String(j+1)+')'),h('span',{},x))))}
function renderPart(i,p,part,t,locked){const box=h('div',{class:'part'});
  if(part.pre)box.append(h('div',{class:'quote'},part.pre));
  if(part.label)box.append(h('p',{class:'plabel'},part.label));
  let hint='';
  if(part.t==='sel'){
    if(part.left){
      box.append(h('div',{class:'lists'},
        h('ul',{class:'list'},h('h4',{},part.lt),...part.left.map((x,j)=>h('li',{},h('span',{class:'mark'},L[j]+')'),h('span',{},x)))),
        numList(part.right,part.rtitle)));
      hint='Запишите цифры подряд, в порядке букв '+part.slots.join(', ')+'.'}
    else if(part.items){box.append(numList(part.items));hint='Запишите цифры подряд, в хронологическом порядке (от раннего к позднему).'}
    else{
      const body=h('tbody');
      part.table.forEach(r=>body.append(h('tr',{},...r.map(c=>h('td',{},typeof c==='string'?c:h('b',{class:'ph'},'('+c.s+')'))))));
      box.append(h('div',{class:'tablebox'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Географический объект'),h('th',{},'Событие'),h('th',{},'Время'))),body)));
      box.append(numList(part.opts,'Пропущенные элементы'));
      hint='Запишите цифры подряд, в порядке букв '+part.slots.join(', ')+'.'}
  }else if(part.t==='multi'){box.append(numList(part.items));hint='Запишите цифры верных суждений.'}
  const inp=h('input',{type:'text',id:cid(i,p,0),placeholder:part.t==='text'?(part.ph||''):'Ответ',autocomplete:'off',spellcheck:'false',inputmode:part.t==='text'?'text':'numeric',disabled:locked,'aria-label':'Ответ'});
  inp.value=t.vals[cid(i,p,0)]||'';inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  box.append(h('div',{class:'ans'},part.t==='text'?null:h('label',{for:cid(i,p,0)},'Ответ:'),inp,hint?h('p',{class:'hint'},hint):null));
  return box}

function keyText(i){return TASKS[i].parts.map(part=>{
  if(part.t==='sel')return part.left||part.table?part.slots.map((s,k)=>`${s} — ${part.key[k]}`).join(', ')+'  (ответ: '+part.key+')':part.key;
  if(part.t==='multi')return part.key;
  return part.show}).join(' · ')}

function renderTask(i){const t=S.t[i],task=TASKS[i],locked=t.st!=='pending',m=$('main');
  const card=h('section',{class:'card',});
  card.append(h('div',{class:'thead'},h('h2',{},`Задание ${i+1}`),
    h('div',{class:'tries','aria-label':`Использовано попыток: ${t.att} из 3`},'Попытки',...[0,1,2].map(k=>h('span',{class:'dot'+(k<t.att?' used':'')})))),h('p',{class:'src'},task.src));
  card.append(h('p',{class:'intro'},task.intro));
  if(task.quote)card.append(h('div',{class:'quote'},h('b',{},task.quote[0]),task.quote[1]));
  if(task.img){const im=h('img',{class:'map',src:IMG[task.img],alt:'Схема к заданию',onclick:()=>lightbox(IMG[task.img])});card.append(im,h('p',{class:'maphint'},'Нажми на схему, чтобы увеличить.'))}
  task.parts.forEach((part,p)=>card.append(renderPart(i,p,part,t,locked)));
  if(t.st==='fail')card.append(h('div',{class:'key'},h('b',{},'Правильный ответ: '),keyText(i)));
  const act=h('div',{class:'actions'});
  if(!locked)act.append(h('button',{class:'big',type:'button',onclick:check},'Ответить'));
  if(t.msg&&(!locked||true))act.append(h('div',{class:'fb '+(t.msgKind||'warn'),role:'status'},t.msg));
  if(locked){
    if(S.finished)act.append(h('button',{class:'big',type:'button',onclick:()=>{S.view='done';render(true)}},'К итогам'));
    else act.append(h('button',{class:'big',type:'button',onclick:nextTask},pendingList().length?'Дальше':'Продолжить'))}
  card.append(act);m.replaceChildren(card)}

function renderIntro(){const k=S.inTour.length;
  $('main').replaceChildren(h('section',{class:'card big-msg'},h('h2',{},`Тур ошибок №${S.tour}`),
    h('p',{},k===1?'Осталось одно задание, в котором была ошибка:':`Осталось заданий, в которых была ошибка: ${k}.`),
    h('p',{},'Номера: '+S.inTour.map(i=>i+1).join(', ')+'. На каждое снова три попытки.'),
    h('button',{class:'big',type:'button',onclick:()=>{S.view='task';render(true)}},'Начать тур')))}

function renderDone(){const first=S.t.filter(t=>t.first==='ok').length;
  const retried=S.t.map((t,i)=>t.first==='fail'?i+1:null).filter(Boolean);
  const msg=first===N?'Ни одной ошибки. Отлично!':first>=N*0.8?'Очень хороший результат!':first>=N*0.5?'Неплохо, а ошибки ты уже исправил.':'Теперь все задания решены. Повтори материал и попробуй ещё раз.';
  $('main').replaceChildren(h('section',{class:'card big-msg'},h('h2',{},'Тест пройден!'),h('p',{},msg),
    h('div',{class:'tiles'},h('div',{class:'tile'},h('b',{},`${first} из ${N}`),h('span',{},'верно в основном круге')),h('div',{class:'tile'},h('b',{},String(S.tour)),h('span',{},S.tour===1?'тур ошибок':'туров ошибок'))),
    retried.length?h('p',{},'Пришлось повторять: задания '+retried.join(', ')+'.'):null,
    h('button',{class:'big',type:'button',onclick:()=>{S=fresh();render(true)}},'Пройти заново')))}

function lightbox(src){const d=h('div',{class:'lb',onclick:()=>d.remove()},h('img',{src,alt:'Схема'}));document.body.append(d)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.lb').forEach(x=>x.remove())});

let rt;$('reset').addEventListener('click',e=>{const b=e.target;
  if(b.dataset.arm){S=fresh();b.dataset.arm='';b.textContent='Начать заново';render(true);return}
  b.dataset.arm='1';b.textContent='Точно сбросить прогресс?';clearTimeout(rt);rt=setTimeout(()=>{b.dataset.arm='';b.textContent='Начать заново'},3500)});

function render(scroll){renderPlaque();renderStats();
  if(S.view==='intro')renderIntro();else if(S.view==='done')renderDone();else renderTask(S.cur);
  save();
  if(scroll){const pl=$('hdr');window.scrollTo({top:Math.max(0,window.scrollY+$('main').getBoundingClientRect().top-pl.offsetHeight-8),behavior:'smooth'})}}
render(false);
</script>
